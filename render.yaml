services:
  - type: web
    name: darukaa-earth
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
      - key: KNOWLEDGE_URLS
        value: ""
